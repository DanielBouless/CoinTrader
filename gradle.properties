# Gradle JVM memory settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle daemon (reuses JVM between builds)
org.gradle.daemon=true

# Parallel builds
org.gradle.parallel=true

# On-demand configuration
org.gradle.configureondemand=true

# Kotlin compiler daemon memory
kotlin.daemon.jvm.options=-Xmx1500m

# AndroidX
android.useAndroidX=true

# Suppress "AGP 7.3.0 tested up to compileSdk 33" warning when using 34
android.suppressUnsupportedCompileSdk=34

# Run KAPT in the same process as the Gradle daemon (avoids a second JVM spin-up)
kapt.use.worker.api=true
kapt.incremental.apt=true
